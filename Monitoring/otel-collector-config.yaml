receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
      verbosity: detailed
  # setup jaeger, prometheus, whatever else here
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    # traces:
    #   receivers: [otlp]
    #   exporters: [debug]
    # metrics:
    #   receivers: [otlp]
    #   exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
