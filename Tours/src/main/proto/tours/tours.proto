syntax = "proto3";

package tours;

option java_multiple_files = true;
option java_package = "com.tourism.tours.grpc.generated";
option java_outer_classname = "ToursProto";

service TourGrpcService{
  rpc GetMyTours(GetMyToursRequest) returns (TourListResponse);
  rpc CreateTour(CreateTourGrpcRequest) returns (TourGrpcResponse);
}

message GetMyToursRequest {
}

message CreateTourGrpcRequest{
  string name = 2;
  string description = 3;
  string difficulty = 4;
  repeated string tags = 5;
}

message TourListResponse{
  repeated TourGrpcResponse tours = 1;
}

message TourGrpcResponse{
  int64 id = 1;
  int64  authorId = 2;
  string authorUsername = 3;
  string name = 4;
  string description = 5;
  string difficulty = 6;
  repeated string tags = 7;
  string status = 8;
  double price = 9;
}